name: Content Freshness

# Weekly sweep over race guides and dispatch posts for two things: calendar
# dates that have already passed, and upcoming races whose registration status
# has not been re-verified lately (status drifts with no date changing).
#
# Reports to two places on purpose. The GitHub issue is the durable, deduped
# record; the Notion card is the nudge that actually gets seen. A monthly
# issue-only run went unread for two days in Aug 2026 while the race picks post
# advertised three races that had already been run.
#
# Manual runs via the Actions tab.

on:
  schedule:
    # Mondays, 6:15 AM Pacific standard / 7:15 AM during DST → 14:15 UTC.
    # Weekly rather than monthly: a race that runs on the 2nd used to sit
    # wrong for four weeks.
    - cron: '15 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dependency-free scripts: no npm install needed.
      - name: Scan for stale dates and unverified races
        id: scan
        run: |
          set +e
          node scripts/content/check-stale-dates.mjs > report.txt
          echo "findings=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      # Runs on EVERY sweep, including clean ones, and before anything needs it.
      # Both Notion secrets were wrong for the first three weeks this workflow
      # existed and no run ever said so, because the only step that touched
      # Notion ran last and only when there were findings. A clean sweep skipped
      # it entirely, so the broken path stayed invisible.
      - name: Check the Notion board connection
        id: board
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          set +e
          node scripts/content/notify-board.mjs --check > board.txt 2>&1
          status=$?
          cat board.txt
          if [ $status -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Filed when there is content to review OR when the board is unreachable,
      # since in that second case this issue is the only surviving channel.
      - name: Open or update issue
        if: steps.scan.outputs.findings == '1' || steps.board.outputs.ok == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const boardOk = '${{ steps.board.outputs.ok }}' === 'true';

            // When the board is down this issue is the last channel standing,
            // so it has to say so itself. Nothing else will.
            const banner = boardOk ? '' :
              '> [!WARNING]\n' +
              '> **The Notion board card could not be posted, so this issue is the only copy of this report.**\n' +
              '>\n' +
              fs.readFileSync('board.txt', 'utf8').trim().split('\n')
                .map(l => '> ' + l).join('\n') +
              '\n\n';

            const title = boardOk
              ? 'Content freshness: review needed'
              : 'Content freshness: Notion board unreachable';
            const body = `${banner}${report}\n\n_Auto-filed by .github/workflows/stale-dates.yml_`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-freshness',
            });
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['content-freshness'],
              });
            }

      # Runs after the issue so a Notion outage still leaves the durable record.
      # Allowed to fail the job: a broken notification path should be loud,
      # since a silent one is the problem this workflow exists to fix.
      - name: Post card to the Notion board
        if: steps.scan.outputs.findings == '1' && steps.board.outputs.ok == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/content/notify-board.mjs report.txt

      # Sweep came back clean AND the board is healthy, so close any issue left
      # open from a prior run. A broken board keeps it open on purpose.
      - name: Close resolved issue
        if: steps.scan.outputs.findings == '0' && steps.board.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'content-freshness',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Sweep is clean as of this run. Closing automatically.\n\n_.github/workflows/stale-dates.yml_',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      # Last, so the issue above is already filed when the job goes red.
      - name: Fail if the board connection is broken
        if: steps.board.outputs.ok == 'false'
        run: |
          echo "::error::Notion board unreachable. The content-freshness issue has the diagnosis."
          exit 1
