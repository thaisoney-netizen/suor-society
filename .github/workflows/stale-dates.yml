name: Content Freshness

# Runs every morning. Completed races are safe to retire automatically because
# that is date arithmetic over repository data. Registration-status changes are
# never guessed: those remain reports for the two-source verification process.

on:
  schedule:
    # 6:15 AM Pacific standard / 7:15 AM during DST -> 14:15 UTC.
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      regenerate_pdfs:
        description: Regenerate both PDFs even when no race was retired
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: content-freshness-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Retire completed races
        id: retire
        run: |
          set +e
          node scripts/content/check-stale-dates.mjs --fix-past --json > retirement-report.json
          scan_status=$?
          set -e
          if [ "$scan_status" -gt 1 ]; then
            exit "$scan_status"
          fi
          node -e "JSON.parse(require('fs').readFileSync('retirement-report.json', 'utf8'))"
          if git diff --quiet -- src/content/races-en.json src/content/races-br.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.retire.outputs.changed == 'true' || inputs.regenerate_pdfs == true
        run: npm ci

      - name: Install PDF browser
        if: steps.retire.outputs.changed == 'true' || inputs.regenerate_pdfs == true
        run: npx playwright install --with-deps chromium

      - name: Regenerate race-guide PDFs
        if: steps.retire.outputs.changed == 'true' || inputs.regenerate_pdfs == true
        run: node scripts/generate-race-guide-pdf.js

      - name: Commit automatic retirements
        if: steps.retire.outputs.changed == 'true' || inputs.regenerate_pdfs == true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/races-en.json src/content/races-br.json \
            public/2026-race-guide.pdf public/guia-corridas-brasil-2026.pdf
          git diff --staged --quiet || git commit -m 'content: retire completed races [skip ci]'
          git push

      - name: Scan for findings requiring review
        id: scan
        run: |
          set +e
          node scripts/content/check-stale-dates.mjs > report.txt
          echo "findings=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Open or update issue
        if: steps.scan.outputs.findings == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.txt', 'utf8');
            const title = 'Content freshness: source verification needed';
            const body = `The daily sweep found content that cannot be changed without source verification.\n\n${report}\n\n_Auto-filed by .github/workflows/stale-dates.yml_`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'content-freshness',
            });
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issues[0].number, title, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['content-freshness'],
              });
            }

      - name: Post card to the Notion board
        if: steps.scan.outputs.findings == '1'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/content/notify-board.mjs report.txt

      - name: Close resolved issue
        if: steps.scan.outputs.findings == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'content-freshness',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Sweep is clean as of this run. Closing automatically.\n\n_.github/workflows/stale-dates.yml_',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed', state_reason: 'completed',
              });
            }
