name: LinkedIn Marketing Jobs Alert

on:
  schedule:
    # 8 AM Pacific (UTC-7 summer / UTC-8 winter) → fire at 15:00 UTC
    - cron: '0 15 * * *'
    # 8 PM Pacific → fire at 03:00 UTC (next calendar day)
    - cron: '0 3 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated sent-jobs.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/linkedin-marketing-jobs-6tWHJ

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download only the Chromium binary (≈ 200 MB); skip other browsers
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Search LinkedIn and send email
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: node scripts/jobs/search.mjs

      - name: Commit updated sent-jobs list
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/jobs/sent-jobs.json
          git diff --staged --quiet || git commit -m "chore: update sent jobs list [skip ci]"
          git push
