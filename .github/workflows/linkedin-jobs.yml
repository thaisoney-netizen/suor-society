name: LinkedIn Marketing Jobs Alert

on:
  schedule:
    # 8:20 AM Pacific (UTC-7 summer) → 15:20 UTC
    - cron: '20 15 * * *'
    # 4:20 PM Pacific → 23:20 UTC
    - cron: '20 23 * * *'
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  search-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the updated sent-jobs.json

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/linkedin-marketing-jobs-6tWHJ

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download only the Chromium binary (≈ 200 MB); skip other browsers
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Search LinkedIn and send email
        env:
          LINKEDIN_LI_AT: ${{ secrets.LINKEDIN_LI_AT }}
          LINKEDIN_JSESSIONID: ${{ secrets.LINKEDIN_JSESSIONID }}
          LINKEDIN_BCOOKIE: ${{ secrets.LINKEDIN_BCOOKIE }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
        run: node scripts/jobs/search.mjs

      - name: Commit updated sent-jobs list
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add scripts/jobs/sent-jobs.json
          git diff --staged --quiet || git commit -m "chore: update sent jobs list [skip ci]"
          git push
