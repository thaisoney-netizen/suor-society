  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

o concepts V1 ============ */\n  --asphalt:    #1C1C1C;  /* near-black; default dark surface */\n  --bone:       #EDE8DC;  /* warm off-white; default light surface */\n  --sunrise:    #E8750A;  /* saturated orange; primary accent */\n  --highlight:  #F0C800;  /* yellow; secondary accent / overlays */\n  --slate:      #3D4A5A;  /* cool dark blue-gray; secondary dark surface */\n  --rust:       #C24B2A;  /* deep red-orange; emphasis / alerts */\n\n  /* ============ NEUTRAL SCALE (asphalt → bone) ============ */\n  --ink-900: #0A0A0A;     /* deepest black (rare) */\n  --ink-800: #141414;     /* asphalt */\n  --ink-700: #1F1F1E;\n  --ink-600: #2A2A28;\n  --ink-500: #3D3D3A;\n  --ink-400: #5A5A55;\n  --ink-300: #807C74;     /* mid gray, secondary text on dark */\n  --ink-200: #B4AEA2;     /* warm light gray */\n  --ink-100: #D1CABC;\n  --ink-050: #EDE8DC;     /* bone */\n  --ink-000: #F7F2E8;     /* lightest bone */\n\n  /* ============ SEMANTIC TOKENS — DARK MODE (default) ============ */\n  --bg:          var(--asphalt);\n  --bg-elev-1:  #1A1A19;          /* slightly lifted card on asphalt */\n  --bg-elev-2:  var(--slate);\n  --surface:    var(--asphalt);\n  --surface-alt: var(--slate);\n\n  --fg:          var(--bone);     /* primary text on dark */\n  --fg-1:        var(--bone);\n  --fg-2:        var(--ink-200);  /* secondary text */\n  --fg-3:        var(--ink-300);  /* tertiary / metadata */\n  --fg-inverse:  var(--asphalt);\n\n  --accent:           var(--sunrise);\n  --accent-hover:    #D16808;\n  --accent-press:    #B85906;\n  --accent-2:         var(--highlight);\n  --emphasis:         var(--rust);\n\n  --border:           rgba(236, 228, 212, 0.12);\n  --border-strong:    rgba(236, 228, 212, 0.24);\n  --divider:          rgba(236, 228, 212, 0.08);\n\n  --overlay-scrim:    linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.85) 100%);\n  --overlay-top:      linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 60%);\n\n  /* ============ TYPOGRAPHY FAMILIES ============ */\n  --font-display:   'Bebas Neue', 'Anton', 'Helvetica Neue', Impact, sans-serif;\n  --font-condensed: 'Barlow Condensed', 'Bebas Neue', 'Oswald', Impact, sans-serif;\n  --font-body:      'Inter', system-ui, -apple-system, 'Helvetica Neue', sans-serif;\n  --font-mono:      'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;\n\n  /* ============ SCALE — DISPLAY (Bebas Neue, all-caps, generous tracking) ============ */\n  --display-xxl: 96px;   /* hero — \"STREETS / TO START LINES\" */\n  --display-xl:  72px;\n  --display-lg:  56px;\n  --display-md:  44px;\n  --display-sm:  32px;\n  --display-leading: 0.92;\n  --display-tracking: 0.05em;\n\n  /* ============ SCALE — CONDENSED (Barlow Condensed for sub-lines, Anton for stamps) ============ */\n  --condensed-xxl: 120px; /* big slogan moments — \"BAD\" */\n  --condensed-xl:  88px;\n  --condensed-lg:  64px;\n  --condensed-md:  44px;\n  --condensed-sm:  28px;\n  --condensed-leading: 0.95;\n  --condensed-tracking: 0.01em;\n\n  /* ============ SCALE — BODY (Inter) ============ */\n  --body-xl:   22px;\n  --body-lg:   18px;\n  --body-md:   16px;\n  --body-sm:   14px;\n  --body-xs:   12px;\n  --body-leading: 1.5;\n\n  /* ============ SCALE — MONO / DATA ============ */\n  --mono-md: 14px;\n  --mono-sm: 12px;\n\n  /* ============ SPACING (4px base) ============ */\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   24px;\n  --space-6:   32px;\n  --space-7:   48px;\n  --space-8:   64px;\n  --space-9:   96px;\n  --space-10: 128px;\n\n  /* ============ RADII (mostly square; small radius only) ============ */\n  --radius-0: 0;       /* default — square corners are the brand */\n  --radius-1: 2px;\n  --radius-2: 4px;\n  --radius-3: 8px;     /* max for chips, small surfaces */\n  --radius-pill: 999px;\n\n  /* ============ BORDERS ============ */\n  --border-1: 1px solid var(--border);\n  --border-2: 2px solid var(--border-strong);\n  --border-hairline: 1px solid var(--divider);\n\n  /* ============ SHADOWS (rare; the brand is mostly flat) ============ */\n  --shadow-1: 0 1px 2px rgba(0,0,0,0.30);\n  --shadow-2: 0 6px 20px rgba(0,0,0,0.45);\n  --shadow-press: inset 0 0 0 2px var(--sunrise);\n\n  /* ============ MOTION ============ */\n  --ease-out:    cubic-bezier(0.2, 0.8, 0.2, 1);\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);\n  --dur-fast:   120ms;\n  --dur-med:    220ms;\n  --dur-slow:   400ms;\n\n  /* ============ LAYOUT ============ */\n  --container-max: 1200px;\n  --container-pad: var(--space-5);\n  --grid-gutter:   var(--space-4);\n}\n\n/* ============ LIGHT MODE (bone background) ============ */\n.theme-light {\n  --bg:          var(--bone);\n  --bg-elev-1:  #F2EBDC;\n  --bg-elev-2:  #E0D8C7;\n  --surface:    var(--bone);\n  --surface-alt: #F2EBDC;\n  --fg:          var(--asphalt);\n  --fg-1:        var(--asphalt);\n  --fg-2:        var(--ink-500);\n  --fg-3:        var(--ink-400);\n  --fg-inverse:  var(--bone);\n  --border:           rgba(20, 20, 20, 0.12);\n  --border-strong:    rgba(20, 20, 20, 0.28);\n  --divider:          rgba(20, 20, 20, 0.08);\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT STYLES\n   Use these classes; or extend in component CSS.\n   ============================================================ */\n\nhtml, body {\n  background: var(--bg);\n  color: var(--fg);\n  font-family: var(--font-body);\n  font-size: var(--body-md);\n  line-height: var(--body-leading);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* Display — Bebas Neue, all-caps, generous tracking */\n.display, h1.display, h2.display {\n  font-family: var(--font-display);\n  font-size: var(--display-xl);\n  line-height: var(--display-leading);\n  letter-spacing: var(--display-tracking);\n  font-weight: 900;\n  text-transform: uppercase;\n}\n.display-xxl { font-family: var(--font-display); font-size: var(--display-xxl); line-height: 0.9; letter-spacing: var(--display-tracking); text-transform: uppercase; font-weight: 900; }\n.display-xl  { font-family: var(--font-display); font-size: var(--display-xl);  line-height: 0.92; letter-spacing: var(--display-tracking); text-transform: uppercase; font-weight: 900; }\n.display-lg  { font-family: var(--font-display); font-size: var(--display-lg);  line-height: 0.95; letter-spacing: var(--display-tracking); text-transform: uppercase; font-weight: 900; }\n.display-md  { font-family: var(--font-display); font-size: var(--display-md);  line-height: 1.0;  letter-spacing: var(--display-tracking); text-transform: uppercase; font-weight: 900; }\n.display-sm  { font-family: var(--font-display); font-size: var(--display-sm);  line-height: 1.05; letter-spacing: var(--display-tracking); text-transform: uppercase; font-weight: 900; }\n\n/* Condensed — Anton, big editorial energy */\n.condensed-xxl { font-family: var(--font-condensed); font-size: var(--condensed-xxl); line-height: 0.9;  letter-spacing: 0.005em; text-transform: uppercase; }\n.condensed-xl  { font-family: var(--font-condensed); font-size: var(--condensed-xl);  line-height: 0.95; letter-spacing: 0.01em;  text-transform: uppercase; }\n.condensed-lg  { font-family: var(--font-condensed); font-size: var(--condensed-lg);  line-height: 1.0;  letter-spacing: 0.01em;  text-transform: uppercase; }\n.condensed-md  { font-family: var(--font-condensed); font-size: var(--condensed-md);  line-height: 1.05; letter-spacing: 0.02em;  text-transform: uppercase; }\n.condensed-sm  { font-family: var(--font-condensed); font-size: var(--condensed-sm);  line-height: 1.1;  letter-spacing: 0.04em;  text-transform: uppercase; }\n\n/* Eyebrow / caption / metadata */\n.eyebrow {\n  font-family: var(--font-body);\n  font-size: 11px;\n  font-weight: 600;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--fg-2);\n}\n.caption {\n  font-family: var(--font-body);\n  font-size: var(--body-sm);\n  color: var(--fg-2);\n  line-height: 1.4;\n}\n\n/* Body */\np, .p { font-family: var(--font-body); font-size: var(--body-md); line-height: var(--body-leading); color: var(--fg-1); }\n.lede { font-size: var(--body-xl); line-height: 1.4; color: var(--fg-1); }\n.small { font-size: var(--body-sm); color: var(--fg-2); }\n\n/* Mono — splits, pace, data */\n.mono { font-family: var(--font-mono); font-size: var(--mono-md); letter-spacing: 0.01em; }\n.mono-sm { font-family: var(--font-mono); font-size: var(--mono-sm); letter-spacing: 0.02em; }\ncode, pre { font-family: var(--font-mono); }\n\n/* Headings (semantic mapping) */\nh1 { font-family: var(--font-display); font-size: var(--display-xl); line-height: var(--display-leading); letter-spacing: var(--display-tracking); text-transform: uppercase; margin: 0; }\nh2 { font-family: var(--font-display); font-size: var(--display-lg); line-height: 1.0; letter-spacing: var(--display-tracking); text-transform: uppercase; margin: 0; }\nh3 { font-family: var(--font-condensed); font-size: var(--condensed-md); line-height: 1.05; letter-spacing: 0.02em; text-transform: uppercase; margin: 0; }\nh4 { font-family: var(--font-body); font-size: var(--body-lg); font-weight: 700; line-height: 1.3; margin: 0; }\n\na { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color var(--dur-fast) var(--ease-out); }\na:hover { border-bottom-color: var(--accent); }\n\n/* Selection — branded */\n::selection { background: var(--sunrise); color: var(--asphalt); }\n\n/* Bold accent text utility */\n.t-sunrise   { color: var(--sunrise); }\n.t-highlight { color: var(--highlight); }\n.t-rust      { color: var(--rust); }\n.t-bone      { color: var(--bone); }\n.t-asphalt   { color: var(--asphalt); }\n\n/* Backgrounds */\n.bg-asphalt   { background: var(--asphalt); color: var(--bone); }\n.bg-bone      { background: var(--bone); color: var(--asphalt); }\n.bg-slate     { background: var(--slate); color: var(--bone); }\n.bg-sunrise   { background: var(--sunrise); color: var(--asphalt); }\n.bg-rust      { background: var(--rust); color: var(--bone); }\n<\u002Fstyle>\n\n<style>\n  :root {\n    /* RE-WEIGHT THE PALETTE for the white-dominant brand the user asked for.\n       Black + white carry everything. Accents are spice, not main course. */\n    --paper:        #FFFFFF;\n    --ink:          #0A0A0A;\n    --ink-soft:     #1C1C1C;\n    --rule:         rgba(10,10,10,0.12);\n    --rule-strong:  rgba(10,10,10,0.32);\n    --muted:        #707070;\n    --muted-2:      #A8A8A8;\n    --tint:         #F4F2EE;    /* warm subtle bone tint, sparingly */\n    --accent:       #E8750A;    /* sunrise — small accents only */\n    --accent-deep:  #C24B2A;    /* rust — emphasis */\n    --highlight:    #F0C800;    /* yellow — editorial overlays, very sparing */\n  }\n\n  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }\n  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }\n  body {\n    font-family: var(--font-body);\n    font-size: 15px;\n    line-height: 1.55;\n    text-rendering: optimizeLegibility;\n  }\n  img, svg { display: block; max-width: 100%; }\n\n  /* ---------- Layout primitives ---------- */\n  .page {\n    max-width: 1280px;\n    margin: 0 auto;\n    padding: 0 56px;\n  }\n  @media (max-width: 760px) {\n    .page { padding: 0 24px; }\n  }\n\n  /* Top navigation / chrome */\n  .chrome {\n    position: sticky; top: 0; z-index: 50;\n    background: rgba(255,255,255,0.92);\n    backdrop-filter: blur(14px);\n    border-bottom: 1px solid var(--rule);\n  }\n  .chrome-inner {\n    display: flex; align-items: center; justify-content: space-between;\n    height: 56px;\n  }\n  .chrome-mark {\n    display: flex; align-items: center; gap: 10px;\n    font-family: var(--font-display);\n    line-height: 1;\n  }\n  .chrome-mark svg { width: 20px; height: auto; }\n  .chrome-mark .suor {\n    font-size: 20px;\n    letter-spacing: 0.10em;\n    font-weight: 400;\n  }\n  .chrome-mark .pipe {\n    display: inline-block;\n    width: 1px;\n    height: 16px;\n    background: var(--rule-strong);\n    margin: 0 4px;\n  }\n  .chrome-mark .society {\n    font-family: var(--font-condensed);\n    font-weight: 500;\n    font-size: 11px;\n    letter-spacing: 0.34em;\n    text-transform: uppercase;\n    color: var(--ink);\n    padding-right: 0.34em; /* compensate trailing letter-spacing */\n  }\n  .chrome-nav {\n    display: flex; gap: 28px;\n    font-family: var(--font-condensed);\n    font-weight: 600;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    font-size: 11px;\n    color: var(--muted);\n  }\n  .chrome-nav a { color: inherit; text-decoration: none; transition: opacity .2s; }\n  .chrome-nav a:hover { opacity: 0.6; color: var(--ink); }\n  @media (max-width: 720px) {\n    .chrome-nav { display: none; }\n  }\n\n  /* Section frame */\n  section {\n    padding: 120px 0;\n    border-bottom: 1px solid var(--rule);\n  }\n  section:last-of-type { border-bottom: 0; }\n\n  .section-head {\n    display: grid;\n    grid-template-columns: 200px 1fr;\n    gap: 48px;\n    margin-bottom: 64px;\n    align-items: start;\n  }\n  @media (max-width: 760px) {\n    .section-head { grid-template-columns: 1fr; gap: 16px; margin-bottom: 40px; }\n    section { padding: 72px 0; }\n  }\n  .section-index {\n    font-family: var(--font-condensed);\n    font-weight: 600;\n    font-size: 11px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--muted);\n    padding-top: 18px;\n    border-top: 1px solid var(--ink);\n    display: flex;\n    align-items: baseline;\n    gap: 10px;\n    width: fit-content;\n  }\n  .section-index .num {\n    font-family: var(--font-mono);\n    color: var(--ink);\n  }\n  .section-title {\n    font-family: var(--font-display);\n    font-size: clamp(40px, 6vw, 72px);\n    line-height: 0.92;\n    letter-spacing: 0.02em;\n    text-transform: uppercase;\n    margin: 0 0 16px;\n  }\n  .section-lede {\n    font-family: var(--font-body);\n    font-size: 18px;\n    line-height: 1.5;\n    color: var(--ink-soft);\n    max-width: 60ch;\n    margin: 0;\n  }\n\n  /* ---------- 00 COVER ---------- */\n  .cover {\n    min-height: 92vh;\n    padding: 56px 0 96px;\n    border-bottom: 1px solid var(--rule);\n    display: flex;\n    flex-direction: column;\n    justify-content: space-between;\n  }\n  .cover-meta {\n    display: flex;\n    justify-content: space-between;\n    font-family: var(--font-condensed);\n    font-weight: 600;\n    font-size: 11px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .cover-mark {\n    display: grid;\n    grid-template-columns: auto 1fr;\n    gap: 36px;\n    align-items: end;\n    margin: 64px 0 48px;\n  }\n  .cover-mark .icon {\n    width: 220px; height: 220px;\n    border-radius: 999px;\n    background: var(--ink);\n    display: grid; place-items: center;\n  }\n  .cover-mark .icon svg { width: 64%; height: auto; }\n  .cover-title {\n    font-family: var(--font-display);\n    font-size: clamp(72px, 14vw, 180px);\n    line-height: 0.86;\n    letter-spacing: 0.01em;\n    text-transform: uppercase;\n    margin: 0;\n  }\n  .cover-title .thin {\n    display: block;\n    font-family: var(--font-condensed);\n    font-weight: 600;\n    font-size: 0.18em;\n    letter-spacing: 0.45em;\n    color: var(--muted);\n    margin-top: 18px;\n    margin-left: 4px;\n  }\n  .cover-tag {\n    font-family: var(--font-body);\n    font-size: 17px;\n    color: var(--ink-soft);\n    max-width: 56ch;\n    margin: 0 0 56px;\n  }\n  .cover-foot {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 32px;\n    padding-top: 32px;\n    border-top: 1px solid var(--ink);\n  }\n  .cover-foot div {\n    font-family: var(--font-condensed);\n    font-weight: 600;\n    font-size: 12px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--muted);\n  }\n  .cover-foot div b {\n    display: block; : var(--font-display);\n    font-size: 28px; letter-spacing: 0.04em;\n    text-transform: uppercase;\n    margin: 32px 0 12px;\n  }\n  .blog-article .col-main blockquote {\n    margin: 32px 0;\n    padding-left: 24px;\n    border-left: 3px solid var(--accent);\n    font-family: var(--font-display);\n    font-size: 32px; letter-spacing: 0.02em; line-height: 1;\n    text-transform: uppercase;\n  }\n  .blog-article .col-main .data-block {\n    margin: 24px 0;\n    padding: 20px;\n    background: var(--tint);\n    font-family: var(--font-mono);\n    font-size: 13px;\n    line-height: 1.7;\n    color: var(--ink-soft);\n  }\n  .blog-article .col-main .data-block .row {\n    display: grid;\n    grid-template-columns: 80px 1fr auto;\n    gap: 12px;\n    padding: 4px 0;\n    border-bottom: 1px dashed var(--rule);\n  }\n  .blog-article .col-main .data-block .row:last-child { border-bottom: 0; }\n  .blog-article .col-right {\n    display: grid; gap: 16px; align-content: start;\n  }\n  .blog-article .col-right .tags {\n    font-family: var(--font-condensed); font-weight: 600;\n    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--muted);\n  }\n  .blog-article .col-right .tag-list {\n    display: flex; flex-wrap: wrap; gap: 6px;\n    margin-top: 8px;\n  }\n  .blog-article .col-right .tag-list span {\n    padding: 4px 10px;\n    border: 1px solid var(--ink);\n    font-family: var(--font-condensed); font-weight: 600;\n    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;\n    color: var(--ink);\n  }\n  .blog-article .col-right .pull {\n    font-family: var(--font-display);\n    font-size: 22px; letter-spacing: 0.02em; line-height: 1;\n    text-transform: uppercase;\n    border-top: 2px solid var(--ink);\n    padding-top: 12px;\n    margin-top: 24px;\n  }\n\n  /* Blog tile (post card) */\n  .blog-tiles {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 24px;\n    margin-top: 24px;\n  }\n  @media (max-width: 760px) { .blog-tiles { grid-template-columns: 1fr; } }\n  .blog-tile {\n    border: 1px solid var(--rule);\n    background: var(--paper);\n    overflow: hidden;\n  }\n  .blog-tile .ph {\n    aspect-ratio: 16/10;\n    background:\n      linear-gradient(165deg, #2b313a 0%, #0d1015 100%);\n    position: relative;\n  }\n  .blog-tile.warm .ph {\n    background:\n      radial-gradient(circle at 70% 30%, rgba(232,117,10,0.18) 0%, rgba(0,0,0,0) 60%),\n      linear-gradient(160deg, #efe7d5 0%, #cdb89a 100%);\n  }\n  .blog-tile .ph .kicker {\n    position: absolute; top: 14px; left: 14px;\n    font-family: var(--font-condensed); font-weight: 700;\n    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;\n    background: var(--paper); color: var(--ink);\n    padding: 4px 8px;\n  }\n  .blog-tile .body { padding: 24px; }\n  .blog-tile .body h4 {\n    font-family: var(--font-display);\n    font-size: 26px; letter-spacing: 0.02em; line-height: 0.98;\n    text-transform: uppercase;\n    margin: 0 0 8px;\n  }\n  .blog-tile .body p {\n    font-family: var(--font-body); font-size: 14px;\n    color: var(--muted); margin: 0;\n    line-height: 1.5;\n  }\n  .blog-tile .body .meta {\n    margin-top: 16px;\n    font-family: var(--font-mono); font-size: 11px;\n    color: var(--muted);\n    display: flex; gap: 16px;\n  }\n\n  /* ---------- 09 OUTRO ---------- */\n  .outro {\n    padding: 120px 0 160px;\n    text-align: center;\n  }\n  .outro .stamp {\n    width: 120px; height: 120px;\n    border-radius: 999px;\n    background: var(--ink);\n    margin: 0 auto 32px;\n    display: grid; place-items: center;\n  }\n  .outro .stamp svg { width: 60%; }\n  .outro h2 {\n    font-family: var(--font-display);\n    font-size: clamp(40px, 6vw, 72px);\n    letter-spacing: 0.04em;\n    line-height: 0.92;\n    text-transform: uppercase;\n    margin: 0 0 16px;\n  }\n  .outro p {\n    font-family: var(--font-condensed); font-weight: 600;\n    font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;\n    color: var(--muted);\n    margin: 0;\n  }\n  .outro .end-line {\n    margin-top: 56px;\n    font-family: var(--font-mono); font-size: 11px;\n    color: var(--muted-2);\n  }\n\n  /* utility tiny stride/drop SVGs reused */\n  .util-hidden { position: absolute; width: 0; height: 0; overflow: hidden; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- Reusable inline SVG defs for the drop+stride icon, in both black-on-white and white-on-black -->\n<svg class=\"util-hidden\" aria-hidden=\"true\">\n  <defs>\n    <!-- black drop with white strides cut out (use on white BG) -->\n    <symbol id=\"drop-black\" viewBox=\"0 0 200 236\">\n      <mask id=\"m-black\"><rect width=\"200\" height=\"236\" fill=\"#fff\"><\u002Frect>\n        <rect x=\"40\" y=\"118\" width=\"44\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 62 122)\"><\u002Frect>\n        <rect x=\"100\" y=\"138\" width=\"60\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 130 142)\"><\u002Frect>\n        <rect x=\"56\" y=\"160\" width=\"80\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 96 164)\"><\u002Frect>\n      <\u002Fmask>\n      <path class=\"drop-shape\" d=\"M100,16 L154,132 A54,54 0 0,1 46,132 Z\" fill=\"#0A0A0A\" mask=\"url(#m-black)\"><\u002Fpath>\n    <\u002Fsymbol>\n    <!-- white drop with black strides cut out (use on dark BG) -->\n    <symbol id=\"drop-white\" viewBox=\"0 0 200 236\">\n      <mask id=\"m-white\"><rect width=\"200\" height=\"236\" fill=\"#fff\"><\u002Frect>\n        <rect x=\"40\" y=\"118\" width=\"44\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 62 122)\"><\u002Frect>\n        <rect x=\"100\" y=\"138\" width=\"60\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 130 142)\"><\u002Frect>\n        <rect x=\"56\" y=\"160\" width=\"80\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 96 164)\"><\u002Frect>\n      <\u002Fmask>\n      <path class=\"drop-shape\" d=\"M100,16 L154,132 A54,54 0 0,1 46,132 Z\" fill=\"#FFFFFF\" mask=\"url(#m-white)\"><\u002Fpath>\n    <\u002Fsymbol>\n    <!-- sunrise variant for accent moments -->\n    <symbol id=\"drop-sun\" viewBox=\"0 0 200 236\">\n      <mask id=\"m-sun\"><rect width=\"200\" height=\"236\" fill=\"#fff\"><\u002Frect>\n        <rect x=\"40\" y=\"118\" width=\"44\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 62 122)\"><\u002Frect>\n        <rect x=\"100\" y=\"138\" width=\"60\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 130 142)\"><\u002Frect>\n        <rect x=\"56\" y=\"160\" width=\"80\" height=\"9\" fill=\"#000\" transform=\"rotate(-22 96 164)\"><\u002Frect>\n      <\u002Fmask>\n      <path class=\"drop-shape\" d=\"M100,16 L154,132 A54,54 0 0,1 46,132 Z\" fill=\"#E8750A\" mask=\"url(#m-sun)\"><\u002Fpath>\n    <\u002Fsymbol>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n<!-- ─────────── chrome ─────────── -->\n<div class=\"chrome\">\n  <div class=\"page chrome-inner\">\n    <div class=\"chrome-mark\" data-comment-anchor=\"387ecba446-div\">\n      <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n      <span class=\"suor\">SUOR<\u002Fspan>\n      <span class=\"pipe\"><\u002Fspan>\n      <span class=\"society\">SOCIETY<\u002Fspan>\n    <\u002Fdiv>\n    <nav class=\"chrome-nav\">\n      <a href=\"#essence\">01 Essence<\u002Fa>\n      <a href=\"#logo\">02 Logo<\u002Fa>\n      <a href=\"#color\">03 Color<\u002Fa>\n      <a href=\"#type\">04 Type<\u002Fa>\n      <a href=\"#voice\">05 Voice<\u002Fa>\n      <a href=\"#photo\">06 Photo<\u002Fa>\n      <a href=\"#ig\">07 IG<\u002Fa>\n      <a href=\"#blog\">08 Blog<\u002Fa>\n    <\u002Fnav>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ─────────── 00 COVER ─────────── -->\n<div class=\"page cover\">\n  <div class=\"cover-meta\">\n    <span>Brand Guidelines · v1.0<\u002Fspan>\n    <span>Brand Book · 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div>\n    <div class=\"cover-mark\">\n      <div class=\"icon\">\n        <svg viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n      <h1 class=\"cover-title\" data-comment-anchor=\"404da2e2ea-h1\">\n        Suor<br>Society\n        <span class=\"thin\">For the runner who lifts, the lifter who runs<\u002Fspan>\n      <\u002Fh1>\n    <\u002Fdiv>\n    <p class=\"cover-tag\" data-comment-anchor=\"6c3f11faa4-p\">A hybrid running culture page for the runner who lifts and the lifter who runs. Crew runs, gear drops, race days, coffee stops, everything in between. This document is the rulebook.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"cover-foot\">\n    <div>Vibe<b>Raw · Crew · Performance<\u002Fb><\u002Fdiv>\n    <div>Palette<b>White · Black · Sunrise<\u002Fb><\u002Fdiv>\n    <div>Voice<b>Direct. Specific. No filler.<\u002Fb><\u002Fdiv>\n    <div>Status<b>Pre-launch · Internal<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ─────────── 01 ESSENCE ─────────── -->\n<section id=\"essence\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">01<\u002Fspan> Essence<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">What we are.<br>And what we aren't.<\u002Fh2>\n        <p class=\"section-lede\" data-comment-anchor=\"1c81824114-p\">Suor sits in the lift-and-run middle. Not country-club preppy, not full streetwear, not generic fitness. A culture page for the lift-and-run crowd. Marketer-built. Brand activations in person.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"essence-grid\">\n      <div>\n        <h3 data-comment-anchor=\"2e67e9731e-h3\">Raw<\u002Fh3>\n        <p data-comment-anchor=\"23110c4f73-p\">Streets at 7am. Iron under the lights. Grain on the photo. The brand is allergic to gloss, slogans, and beige confidence.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3 data-comment-anchor=\"1cd36cb48f-h3\">Crew<\u002Fh3>\n        <p data-comment-anchor=\"d8be52f718-p\">Real moments in an aesthetic shoot. The crew first, the hero shot never. 70% culture, 30% the founder.<\u002Fp>\n      <\u002Fdiv>\n      <div data-comment-anchor=\"b8df525e02-div\">\n        <h3 data-comment-anchor=\"ca305c2905-h3\">Lift &amp; Run<\u002Fh3>\n        <p>You squatted heavy yesterday and ran six today. We show the smart way to do both without breaking. Programmed, not improvised.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <p class=\"essence-pull\">For the runner who lifts.<br>The lifter who runs.<br><span class=\"accent\">And everyone figuring it out.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 02 LOGO ─────────── -->\n<section id=\"logo\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">02<\u002Fspan> Logo<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Two marks.<br>Both live on white.<\u002Fh2>\n        <p class=\"section-lede\">The brand has one icon — the drop with strides cut into it as negative space — and one wordmark. The primary surface for both is white. Dark versions exist for one reason only: when the surface is already dark (an IG avatar, a photo, a t-shirt back).<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- primary lockup on white -->\n    <div class=\"logo-primary-block\">\n      <span class=\"corner-tr\"><\u002Fspan>\n      <span class=\"corner-bl\"><\u002Fspan>\n      <span class=\"corner-br\"><\u002Fspan>\n      <div class=\"lockup-stacked\">\n        <div class=\"icon-mark-circle\">\n          <svg viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"wordmark\">\n          <span class=\"word\">SUOR<\u002Fspan>\n          <span class=\"divider\"><\u002Fspan>\n          <span class=\"sub\">SOCIETY<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"logo-pair\">\n      <!-- icon only on white -->\n      <div class=\"swatch-card\">\n        <span class=\"label\">Icon · White surface<\u002Fspan>\n        <div class=\"icon-only on-white\">\n          <svg viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <span class=\"badge\">primary<\u002Fspan>\n      <\u002Fdiv>\n      <!-- icon only on black -->\n      <div class=\"swatch-card dark\">\n        <span class=\"label\">Icon · Dark surface only<\u002Fspan>\n        <div class=\"icon-only on-black\">\n          <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <span class=\"badge\">avatar / inverted<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- construction & clearspace -->\n    <div class=\"construction-grid\">\n      <div class=\"panel\">\n        <div class=\"panel-title\">Construction · the drop + stride<\u002Fdiv>\n        <div style=\"display:grid;place-items:center;height:260px;\">\n          <div style=\"position:relative;width:220px;height:260px;\">\n            <!-- grid lines -->\n            <svg viewBox=\"0 0 220 260\" style=\"position:absolute;inset:0;width:100%;height:100%;\">\n              <g stroke=\"#E8750A\" stroke-width=\"0.5\" stroke-dasharray=\"3 3\" opacity=\"0.7\">\n                <line x1=\"10\" y1=\"20\" x2=\"210\" y2=\"20\"><\u002Fline>\n                <line x1=\"10\" y1=\"140\" x2=\"210\" y2=\"140\"><\u002Fline>\n                <line x1=\"10\" y1=\"240\" x2=\"210\" y2=\"240\"><\u002Fline>\n                <line x1=\"110\" y1=\"10\" x2=\"110\" y2=\"250\"><\u002Fline>\n              <\u002Fg>\n              <!-- the drop -->\n              <g transform=\"translate(10, 12)\">\n                <use href=\"#drop-black\"><\u002Fuse>\n              <\u002Fg>\n              <!-- callouts -->\n              <g font-family=\"JetBrains Mono, monospace\" font-size=\"9\" fill=\"#707070\">\n                <text x=\"0\" y=\"18\">A<\u002Ftext>\n                <text x=\"0\" y=\"138\">B<\u002Ftext>\n                <text x=\"0\" y=\"246\">C<\u002Ftext>\n              <\u002Fg>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel-note\">\n          The drop arcs from a single apex at A to a 54° radius at C. Three stride lines, parallel at −22°, are carved as negative space below the equator (B). The drop reads as a drop in a thumbnail and as a runner moving up close. Hides a second layer of meaning.\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <div class=\"panel-title\">Clearspace · 1X minimum<\u002Fdiv>\n        <div class=\"clearspace-stage\" style=\"height:260px;\">\n          <div class=\"wm-mini\">\n            <span>SUOR<\u002Fspan>\n            <span style=\"width:1px;height:24px;background:var(--ink);opacity:0.45;\"><\u002Fspan>\n            <span style=\"font-family:var(--font-condensed);font-weight:600;font-size:9px;letter-spacing:0.42em;padding-bottom:0.18em;\">SOCIETY<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel-note\">\n          Padding on all sides of the wordmark equals the cap height of the “S”. Nothing breaks that boundary — including other type, photo edges, or device chrome.\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- size strip -->\n    <div style=\"margin-top:48px;\">\n      <div class=\"panel-title\" style=\"margin-bottom:16px;\">Minimum sizes<\u002Fdiv>\n      <div class=\"size-strip\">\n        <div class=\"item\">\n          <svg viewBox=\"0 0 200 236\" width=\"16\" height=\"19\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <span class=\"lbl\">16px · favicon<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <svg viewBox=\"0 0 200 236\" width=\"32\" height=\"38\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <span class=\"lbl\">32px · UI<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <svg viewBox=\"0 0 200 236\" width=\"56\" height=\"66\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <span class=\"lbl\">56px · avatar<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <svg viewBox=\"0 0 200 236\" width=\"96\" height=\"113\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <span class=\"lbl\">96px · standard<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <svg viewBox=\"0 0 200 236\" width=\"160\" height=\"189\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <span class=\"lbl\">160px+ · hero<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- do / dont -->\n    <div class=\"dodont\">\n      <div class=\"card do\">\n        <span class=\"tag\">Do<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Black on white. Default.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card do bg-dark\">\n        <span class=\"tag\">Do<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\" style=\"color:rgba(255,255,255,0.7)\">White on dark, for IG avatar or photo overlay.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont stretched\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t squash, stretch, or skew the drop.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont rotated\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t rotate. The strides have a direction.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont colored bg-tint\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t fill with accent color. Black, white, or nothing.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\" style=\"filter:drop-shadow(0 6px 12px rgba(0,0,0,0.4));\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t add drop shadows or glows.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont\" style=\"background:#cdb89a;\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\"><svg viewBox=\"0 0 200 236\" width=\"80\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t place on busy or low-contrast photo areas.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"card dont\">\n        <span class=\"tag\">Don’t<\u002Fspan>\n        <div class=\"demo\" style=\"border:2px solid var(--ink);border-radius:8px;padding:8px;\"><svg viewBox=\"0 0 200 236\" width=\"60\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <span class=\"note\">Don’t cage in extra containers or borders.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 03 COLOR ─────────── -->\n<section id=\"color\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">03<\u002Fspan> Color<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Two colors do the work.<br>Three colors do the talking.<\u002Fh2>\n        <p class=\"section-lede\">The brand runs on paper white and asphalt black. Sunrise, highlight, and rust appear in small doses — an underline, a stamp word, a single chip. Never as backgrounds. Never as gradients. If a layout needs more color to feel finished, the layout is wrong.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"palette-primary\">\n      <div class=\"swatch paper\">\n        <div class=\"swatch-role\">Primary surface<\u002Fdiv>\n        <div class=\"swatch-name\">Paper<\u002Fdiv>\n        <div class=\"swatch-meta\">\n          <span>#FFFFFF<\u002Fspan>\n          <span>~70% of all output<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch ink\">\n        <div class=\"swatch-role\">Primary ink<\u002Fdiv>\n        <div class=\"swatch-name\">Asphalt<\u002Fdiv>\n        <div class=\"swatch-meta\">\n          <span>#0A0A0A<\u002Fspan>\n          <span>~26% of all output<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"palette-accents\">\n      <div class=\"swatch\">\n        <div>\n          <div class=\"rl\">Accent · 01<\u002Fdiv>\n          <div class=\"nm\">Sunrise<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"chip\" style=\"background: #E8750A;\"><\u002Fdiv>\n          <div class=\"hex\" style=\"margin-top:6px;\">#E8750A · use sparingly<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div>\n          <div class=\"rl\">Accent · 02<\u002Fdiv>\n          <div class=\"nm\">Highlight<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"chip\" style=\"background: #F0C800;\"><\u002Fdiv>\n          <div class=\"hex\" style=\"margin-top:6px;\">#F0C800 · event posters only<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch\">\n        <div>\n          <div class=\"rl\">Accent · 03<\u002Fdiv>\n          <div class=\"nm\">Rust<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"chip\" style=\"background: #C24B2A;\"><\u002Fdiv>\n          <div class=\"hex\" style=\"margin-top:6px;\">#C24B2A · emphasis / stamp<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"swatch dim\">\n        <div>\n          <div class=\"rl\">Neutral · alt<\u002Fdiv>\n          <div class=\"nm\">Bone<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"chip\" style=\"background: #F4F2EE; border:1px solid var(--rule);\"><\u002Fdiv>\n          <div class=\"hex\" style=\"margin-top:6px;\">#F4F2EE · subtle tint<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ratio-bar\">\n      <div class=\"r-paper\">Paper · 70%<\u002Fdiv>\n      <div class=\"r-ink\">Asphalt · 26%<\u002Fdiv>\n      <div class=\"r-sun\">Sun<\u002Fdiv>\n      <div class=\"r-other\">Hi<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 04 TYPE ─────────── -->\n<section id=\"type\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">04<\u002Fspan> Type<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Big display.<br>Quiet body.<br>Mono for data.<\u002Fh2>\n        <p class=\"section-lede\">Bebas Neue does the loud talking. Inter handles every word a human actually reads. Barlow Condensed labels the world. JetBrains Mono shows up only when there’s a number worth showing (pace, distance, time, count). Anton is held in reserve for big stamp moments.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"type-stack\">\n      <div class=\"type-row\">\n        <div class=\"role\">Display<\u002Fdiv>\n        <div class=\"sample smp-display\">Showed up.<\u002Fdiv>\n        <div class=\"meta\">Bebas Neue · 400<br>Tracking 4%<br>UPPERCASE<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"role\">Condensed<\u002Fdiv>\n        <div class=\"sample smp-condensed\">Crew Run · 05.04<\u002Fdiv>\n        <div class=\"meta\">Barlow Condensed · 600<br>Tracking 32%<br>UPPERCASE<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"role\">Body<\u002Fdiv>\n        <div class=\"sample smp-body\">First six miler in the build. Felt like garbage at mile two. Felt like a person at mile four. Showed up. Counts.<\u002Fdiv>\n        <div class=\"meta\">Inter · 400/500/600<br>16–18px<br>Sentence case<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"role\">Mono · Data<\u002Fdiv>\n        <div class=\"sample smp-mono\">06.2 mi · 7:42 / mi · 47:54<\u002Fdiv>\n        <div class=\"meta\">JetBrains Mono · 400/600<br>For pace · splits · stamps<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"type-row\">\n        <div class=\"role\">Stamp<\u002Fdiv>\n        <div class=\"sample\" style=\"font-family:'Anton',var(--font-display);font-size:88px;letter-spacing:0.02em;line-height:1;text-transform:uppercase;\">RAW.<\u002Fdiv>\n        <div class=\"meta\">Anton · 400<br>Stamp moments only<br>Use 1× per layout, max.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"type-in-use\">\n      <div>\n        <div class=\"meta\">Bay loop · 07:14am · 06 mi<\u002Fdiv>\n        <h2>Three of us<br>out there.<br>All of us<br>better for it.<\u002Fh2>\n      <\u002Fdiv>\n      <div>\n        <div class=\"meta\">Tuesday split<\u002Fdiv>\n        <div class=\"data\">\n          mi 01 ····· 8:12<br>\n          mi 02 ····· 7:48<br>\n          mi 03 ····· <span>7:34<\u002Fspan><br>\n          mi 04 ····· 7:39<br>\n          mi 05 ····· 7:41<br>\n          mi 06 ····· <span>7:18<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 05 VOICE ─────────── -->\n<section id=\"voice\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">05<\u002Fspan> Voice<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Read it out loud.<br>If it sounds like a brand,<br>rewrite it.<\u002Fh2>\n        <p class=\"section-lede\">Confident, grounded, dry. A friend-who-knows-a-lot-about-running texting you. No em dashes. No three sentences in a row at the same length. No wrap-up at the end — end on the last point and stop.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"voice-grid\">\n      <div class=\"do\">\n        <h4><span class=\"dot\"><\u002Fspan> We say<\u002Fh4>\n        <ul>\n          <li>Hell yeah.<\u002Fli>\n          <li>Showed up. Counts.<\u002Fli>\n          <li>Out the door.<\u002Fli>\n          <li>Did the thing.<\u002Fli>\n          <li>Not perfect, just consistent.<\u002Fli>\n          <li>Holy shit (sparingly).<\u002Fli>\n          <li>Bay loop at 7:14.<\u002Fli>\n          <li>3 of us out there.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"dont\">\n        <h4><span class=\"dot\"><\u002Fspan> We don’t say<\u002Fh4>\n        <ul>\n          <li>You got this queen.<\u002Fli>\n          <li>Let’s dive in.<\u002Fli>\n          <li>It hits different.<\u002Fli>\n          <li>Game changer.<\u002Fli>\n          <li>Robust. Holistic.<\u002Fli>\n          <li>Journey. Unlock.<\u002Fli>\n          <li>Elevate. Empower.<\u002Fli>\n          <li>Tapestry. Embark.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"caption-examples\">\n      <div class=\"caption-card\">\n        <div class=\"badge\">Culture voice · 70%<\u002Fdiv>\n        <blockquote>Runners who lift don’t get enough credit. You squatted heavy yesterday and ran 6 today. That’s insane.<\u002Fblockquote>\n      <\u002Fdiv>\n      <div class=\"caption-card\">\n        <div class=\"badge\">Personal voice · 30%<\u002Fdiv>\n        <blockquote>The bay this morning was that weird purple light kind of cold. 3 of us out there at 7:14. No one wanted to be there. All of us better for it.<\u002Fblockquote>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 06 PHOTOGRAPHY ─────────── -->\n<section id=\"photo\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">06<\u002Fspan> Photography<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Grain. Contrast.<br>Group shots over hero shots.<\u002Fh2>\n        <p class=\"section-lede\">Two image moods. Culture posts skew darker, urban, high-contrast — asphalt and slate dominant. Personal posts run cleaner, warmer, natural light, retro palette. B&amp;W is welcome, especially for spotlights and editorial covers.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"photo-grid\">\n      <div class=\"photo-cell dawn big\">\n        <svg class=\"ph-icon\" viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n        <span class=\"ph-label\">crew · bay loop · 7am<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"photo-cell bw\">\n        <span class=\"ph-label\">spotlight · b&amp;w · cover<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"photo-cell warm\">\n        <span class=\"ph-label\">personal · post-run · warm<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"photo-cell crew\">\n        <span class=\"ph-label\">gear · low-key product<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"photo-cell\">\n        <span class=\"ph-label\">placeholder · drop in your shoot<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"photo-rules\">\n      <div class=\"rule\"><div class=\"h\">Do<\u002Fdiv><div class=\"b\">Skew dark in editing. Asphalt and slate dominant. Sunrise and rust pop against dark. Add subtle film grain at 3–5% on dark surfaces for the moodboard’s editorial feel.<\u002Fdiv><\u002Fdiv>\n      <div class=\"rule\"><div class=\"h\">Don’t<\u002Fdiv><div class=\"b\">No HDR. No tilt-shift. No filtered orange-and-teal looks. No stock-fitness models. No mid-air leaping silhouettes with the sun behind them.<\u002Fdiv><\u002Fdiv>\n      <div class=\"rule\"><div class=\"h\">Caption it<\u002Fdiv><div class=\"b\">Specific locations beat generic. “Bay loop, 7am” beats “morning run.” “Squat day at the gym” beats “strength training.”<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 07 IG TEMPLATES ─────────── -->\n<section id=\"ig\">\n  <div class=\"page\" data-comment-anchor=\"f070c82cf9-div\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">07<\u002Fspan> Instagram<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">Nine post templates.<br>Pick the one that fits the moment.<\u002Fh2>\n        <p class=\"section-lede\">Some posts are pure photo — let the image carry it. Others introduce something, drop something, run a number, or stamp a quote. The format is the message: an editorial spotlight behaves differently than a yellow event poster. Use them on rotation, never two of the same in a row.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"ig-grid\">\n\n      <!-- A · Pure photo -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-a\">\n          <span class=\"ig-tag\">A · Pure photo<\u002Fspan>\n          <svg class=\"ph-icon\" viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n          <span class=\"loc\">bay loop · 07:14<\u002Fspan>\n          <div class=\"ig-watermark\">\n            <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ig-caption\">\n          <span class=\"nm\">A · Pure photo<\u002Fspan>\n          <span class=\"desc\">Let the image breathe. Watermark only.<\u002Fspan>\n          <span class=\"ix\">01/09<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- B · Athlete spotlight -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-b\">\n          <span class=\"ig-tag\">B · Spotlight<\u002Fspan>\n          <div class=\"b-head\">\n            <span class=\"b-cad\">SUOR | SOCIETY<\u002Fspan>\n            <span>Spotlight · No. 03<\u002Fspan>\n          <\u002Fdiv>\n          <svg class=\"b-runner\" viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n          <div class=\"b-name\">[ Athlete Name ]<\u002Fdiv>\n          <div class=\"ig-watermark\">\n            <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ig-caption\">\n          <span class=\"nm\">B · Athlete spotlight<\u002Fspan>\n          <span class=\"desc\">Editorial cover. Serif italic name lockup.<\u002Fspan>\n          <span class=\"ix\">02/09<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- C · Gear drop -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-c\">\n          <span class=\"ig-tag\">C · Gear drop<\u002Fspan>\n          <span class=\"c-num\">No. 014<\u002Fspan>\n          <div class=\"c-data\">\n            <div class=\"c-brand\">SUOR | SOCIETY<\u002Fdiv>\n            <div><span class=\"label\">CATEGORY<\u002Fspan> [ Shoe / Kit / Tech ]<\u002Fdiv>\n            <div><span class=\"label\">BUILT FOR<\u002Fspan> [ Use case ]<\u002Fdiv>\n            <div><span class=\"label\">VERDICT<\u002Fspan> [ Short take ]<\u002Fdiv>\n            <div><span class=\"label\">PRICE<\u002Fspan> [ $0 ]<\u002Fdiv>\n          <\u002Fdiv>\n          <svg class=\"c-shoe\" viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n          <div class=\"ig-watermark\">\n            <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ig-caption\">\n          <span class=\"nm\">C · Gear drop<\u002Fspan>\n          <span class=\"desc\">Mono data overlay. Product front and center.<\u002Fspan>\n          <span class=\"ix\">03/09<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- D · Event poster -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-d\">\n          <span class=\"ig-tag\" style=\"background:var(--highlight);color:var(--ink);\">D · Event<\u002Fspan>\n          <svg class=\"d-bolt\" viewBox=\"0 0 24 32\"><path d=\"M14 0 L0 18 L9 18 L7 32 L24 12 L14 12 Z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n          <div class=\"d-big\">Crew<br>Run<br>No. 04<\u002Fdiv>\n          <div class=\"d-sub\">San Diego · Free · No drop<\u002Fdiv>\n          <div class=\"d-meta\">\n            <span>Date<\u002Fspan><b>SAT · MAY 30<\u002Fb>\n            <span>Time<\u002Fspan><b>07:00 AM<\u002Fb>\n            <span>Meet<\u002Fspan><b>[ Location · Pin ]<\u002Fb>\n          <\u002Fdiv>\n          <div class=\"ig-watermark\" style=\"background:var(--highlight);\">\n            <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ig-caption\">\n          <span class=\"nm\">D · Event poster<\u002Fspan>\n          <span class=\"desc\">Anton big type in highlight yellow. Data grid.<\u002Fspan>\n          <span class=\"ix\">04/09<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- E · Pure photo (warm) -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-e\">\n          <span class=\"ig-tag\">E · Warm photo<\u002Fspan>\n          <svg class=\"ph-icon\" viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <div class=\"ig-watermark\">\n            <svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ig-caption\">\n          <span class=\"nm\">E · Warm photo<\u002Fspan>\n          <span class=\"desc\">Personal voice. No copy. Just the shot.<\u002Fspan>\n          <span class=\"ix\">05/09<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- F · Introducing -->\n      <div class=\"ig-card-wrap\">\n        <div class=\"ig-card ig-f\">\n          <span class=\"ig-tag\" style=\"background:var(--ink);color:var(--paper);\">F · Introducing<\u002Fspan>\n          <span class=\"f-tag\">The Dispatch · No. 04<\u002Fspan>\n transform:uppercase;border:1px solid var(--rule);\">The<br>Dispatch<br>No. 04<\u002Fdiv>\n        <div style=\"aspect-ratio:1/1;background:var(--tint);padding:12px;color:var(--ink);font-family:var(--font-mono);font-size:11px;line-height:1.5;\">\n          <div style=\"font-family:var(--font-display);font-size:36px;letter-spacing:-0.02em;\">06.2<span style=\"font-family:var(--font-condensed);font-size:11px;letter-spacing:0.18em;color:var(--muted);\"> MI<\u002Fspan><\u002Fdiv>\n          <div style=\"margin-top:8px;color:var(--ink-soft);\">mi 03 ····· 7:34<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:1/1;background:linear-gradient(165deg,#21252e,#0c0e12);position:relative;\">\n          <span style=\"position:absolute;bottom:8px;left:8px;font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,0.6);\">crew<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"aspect-ratio:1/1;background:linear-gradient(180deg,#2b313a 50%,#5a3a28 50%);color:var(--paper);display:flex;flex-direction:column;justify-content:space-around;padding:12px;font-size:13px;font-family:var(--font-body);\">\n          <span>can you be strong?<\u002Fspan>\n          <span style=\"color:rgba(255,255,255,0.7);\">&amp; still run easy?<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── 08 BLOG TEMPLATES ─────────── -->\n<section id=\"blog\">\n  <div class=\"page\">\n    <div class=\"section-head\">\n      <div class=\"section-index\"><span class=\"num\">08<\u002Fspan> Blog<\u002Fdiv>\n      <div>\n        <h2 class=\"section-title\">The culture archive.<br>Editorial. Specific.<br>Long-form on purpose.<\u002Fh2>\n        <p class=\"section-lede\">Three blog formats: cover, article, and tile. Covers are full-bleed photo and a kicker. Articles use a three-column rhythm — metadata left, body center, pulled quote right. Tiles run in pairs on the archive index. No hero illustrations. No stock heroes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"blog-stack\">\n\n      <!-- Blog cover (full-bleed) -->\n      <div class=\"blog-frame\">\n        <div class=\"bf-bar\">\n          <div class=\"bf-dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n          <span>suorsociety.com / archive / [ post-slug ]<\u002Fspan>\n          <span>cover<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"blog-cover\">\n          <div class=\"top\">\n            <div class=\"brand\">\n              <span class=\"dot\"><svg viewBox=\"0 0 200 236\"><use href=\"#drop-black\"><\u002Fuse><\u002Fsvg><\u002Fspan>\n              SUOR | SOCIETY\n            <\u002Fdiv>\n            <div class=\"meta\">Athlete · 05.24.26 · 8 min read<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"center\">\n            <div class=\"kicker\">Spotlight · No. 03<\u002Fdiv>\n            <h2>The Mile<br>That Broke<br>Him Open<\u002Fh2>\n          <\u002Fdiv>\n          <div class=\"bottom\">\n            <div class=\"standfirst\">[ Athlete Name ] ran their first six-hour 50k. We sat with them after the run and asked how.<\u002Fdiv>\n            <div class=\"credit\">Words · [ Writer ]<br>Photo · [ Location, time ]<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Blog article body -->\n      <div class=\"blog-frame\">\n        <div class=\"bf-bar\">\n          <div class=\"bf-dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n          <span>suorsociety.com / archive / [ post-slug ]<\u002Fspan>\n          <span>article<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"blog-article\">\n          <div class=\"col-left\">\n            <div>Section<b>Spotlight<\u002Fb><\u002Fdiv>\n            <div>Words<b>[ Writer ]<\u002Fb><\u002Fdiv>\n            <div>Date<b>05.24.26<\u002Fb><\u002Fdiv>\n            <div>Read<b>8 min<\u002Fb><\u002Fdiv>\n            <div>Format<b>Long-form<\u002Fb><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"col-main\">\n            <h1>He ran a 50k in six hours. Then he went and lifted.<\u002Fh1>\n            <p class=\"lede\">[ Athlete Name ] is the answer to a question nobody is asking out loud yet. He squats heavy on Mondays. He does long runs on Saturdays. He thinks the two protect each other. We think he’s right.<\u002Fp>\n\n            <p>We met him at the coffee shop after the run. He drinks his iced oat latte. He talks fast. He has the kind of forearms you don’t expect on a 2:32 marathoner.<\u002Fp>\n\n            <p>“People think you have to choose,” he says, and then doesn’t finish the sentence. He doesn’t need to.<\u002Fp>\n\n            <h3>The week, as built<\u002Fh3>\n\n            <p>His training is not complicated. It is consistent. There is a long run, a tempo, two easy days, two lifts, one off. The lifts are heavy. The easy runs are easy. The hard runs are hard. He does not chase pace on the easy days. He does not skip the strength work on tired legs.<\u002Fp>\n\n            <div class=\"data-block\">\n              <div class=\"row\"><span>MON<\u002Fspan><span>Squat day · strength<\u002Fspan><span>60 min<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>TUE<\u002Fspan><span>Easy 8 · bay loop<\u002Fspan><span>8.2 mi<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>WED<\u002Fspan><span>Tempo · progression<\u002Fspan><span>10 mi<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>THU<\u002Fspan><span>Pull day · strength<\u002Fspan><span>55 min<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>FRI<\u002Fspan><span>Easy 5 · shakeout<\u002Fspan><span>5.4 mi<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>SAT<\u002Fspan><span>Long run<\u002Fspan><span>20 mi<\u002Fspan><\u002Fdiv>\n              <div class=\"row\"><span>SUN<\u002Fspan><span>Off · coffee · pizza<\u002Fspan><span>—<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n\n            <blockquote>You can’t outrun a missed lift. And you can’t outlift a missed long run.<\u002Fblockquote>\n\n            <p>The thing he says next is the thing the lift-and-run people have been saying to each other for years, and it’s the reason we made this page. He says, the squat day is what keeps the long run from breaking him. He says the long run is what keeps the squat from making him stiff.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"col-right\">\n            <div>\n              <div class=\"tags\">Tags<\u002Fdiv>\n              <div class=\"tag-list\">\n                <span>Spotlight<\u002Fspan>\n                <span>50K<\u002Fspan>\n                <span>Lift + Run<\u002Fspan>\n                <span>Long Run<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"pull\">Not perfect.<br>Just<br>consistent.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Blog tiles -->\n      <div>\n        <div class=\"panel-title\">Archive index · tiles run in pairs<\u002Fdiv>\n        <div class=\"blog-tiles\">\n          <div class=\"blog-tile\">\n            <div class=\"ph\">\n              <span class=\"kicker\">Gear Drop<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"body\">\n              <h4>The carbon plate test, after 200 miles.<\u002Fh4>\n              <p>One pair of super shoes. Tempo days. Track. One marathon. Honest notes.<\u002Fp>\n              <div class=\"meta\"><span>05.18.26<\u002Fspan><span>6 min<\u002Fspan><span>By the founder<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"blog-tile warm\">\n            <div class=\"ph\">\n              <span class=\"kicker\">Crew Recap<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"body\">\n              <h4>14 of us at the pier, 7am<\u002Fh4>\n              <p>The biggest crew run yet. Coffee after. Cold and worth it.<\u002Fp>\n              <div class=\"meta\"><span>05.11.26<\u002Fspan><span>3 min<\u002Fspan><span>By the founder<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────── outro ─────────── -->\n<div class=\"page outro\">\n  <div class=\"stamp\">\n    <svg viewBox=\"0 0 200 236\"><use href=\"#drop-white\"><\u002Fuse><\u002Fsvg>\n  <\u002Fdiv>\n  <h2>For the runner who lifts.<br>The lifter who runs.<br>And everyone figuring it out.<\u002Fh2>\n  <p>Suor Society · Brand Book · 2026<\u002Fp>\n  <div class=\"end-line\">End of document · v1.0 · review &amp; publish<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
